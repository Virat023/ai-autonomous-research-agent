 
[project]
name = "ai-autonomous-research-agent"
version = "0.1.0"
description = "An AI agent that researches topics and generates evidence-based reports with citations."
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
research-agent = "research_agent.cli:main"
